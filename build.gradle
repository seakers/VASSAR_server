plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
}

group = 'seakers'
version = '1.0'

// Use Java 17
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava {
    options.compilerArgs += ["-Xlint"]
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // 'compile' -> 'implementation'
    implementation group: 'org.orekit', name: 'orekit', version: '10.0'
    implementation 'com.googlecode.combinatoricslib:combinatoricslib:2.2'
    implementation 'org.apache.commons:commons-lang3:3.9'
    implementation 'org.hipparchus:hipparchus-stat:1.5'
    implementation 'seakers:orekit:1.0'
    implementation 'gov.sandia:jess:7.1p2'
    implementation 'seakers:system-architecture-problems:1.0'
    implementation 'seakers:vassar:1.0'
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'
    implementation 'org.moeaframework:moeaframework:2.12'
    implementation 'org.apache.thrift:libthrift:0.12.0'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'io.lettuce:lettuce-core:5.1.8.RELEASE'
    implementation 'io.pebbletemplates:pebble:3.1.0'
    implementation 'com.rabbitmq:amqp-client:5.7.3'
    implementation group: 'org.slf4j', name: 'slf4j-simple', version: '1.7.28'
    implementation group: 'javax.annotation', name: 'javax.annotation-api', version: '1.3.2'

    // 'testCompile' -> 'testImplementation'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.2.0'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'engineer-server'
            from components.java
        }
    }
}

// Application main class (modern DSL for Gradle 7)
application {
    mainClass = 'seakers.engineerserver.server.JavaServer'
}
